# Full policy configuration reference.
# Every policy-level field currently accepted by the controller is represented.

# Optional. Defaults to the policy directory name.
name: fullExample

# Optional. Defaults to <name>.onnx.
onnx: fullExample.onnx

# Optional. Defaults to true. Uses the training data stored in the ONNX file (joint order, q0, action scale,
# kp, kd, observation names), and cross-checks it with this file. See the ONNX metadata docs.
use_onnx_metadata: true

action:
  # Optional. Defaults to all. Joint group defining the ONNX action vector order and size.
  joints: all

  # Optional. Defaults to action.joints. Used when only a subset of joints should be applied (ex: policy outputs all joints while only legs should be used)
  controlled_joints: joint_subset

  # Optional. The ONNX metadata value wins when present.
  # May be either one scalar for every joint...
  # scale: 1.0
  # ...or a complete or partial per-joint map. Unspecified joints use 1.0.
  scale:
    jointName1: 1.0
    jointName2: 1.0
    jointName3: 1.0

  # Optional. The ONNX metadata value wins when present. Joints with no value use the posture task.
  q0:
    jointName1: 0.0
    jointName2: 0.0
    jointName3: 0.0

control:
  # Optional. Defaults to true.
  use_QP: true

  # Optional policy period. Defaults to 0.02 s.
  # Specify either one of period_s and frequency_hz.
  period_s: 0.02
  # frequency_hz: 50.0

  # Optional. Defaults to 1.0. Runtime gains are
  # Kp = ratio * kp and Kd = sqrt(ratio) * kd.
  pd_gains_ratio: 1.0

  # Optional unless a phase observation is used. Defaults to 1.0 s.
  phase_period: 1.0

  # Every joint in robot().refJointOrder() needs a value, here or in the ONNX metadata.
  # Values here win over the metadata.
  kp:
    jointName1: 100.0
    jointName2: 100.0
    jointName3: 100.0
  kd:
    jointName1: 10.0
    jointName2: 10.0
    jointName3: 10.0
